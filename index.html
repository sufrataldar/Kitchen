<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سفرة الدار | المطبخ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="apple-touch-icon" href="https://archive.org/download/untitled-design-71_20251223/Untitled%20design%2821%29.png">
    <link rel="icon" href="https://archive.org/download/untitled-design-71_20251223/Untitled%20design%2821%29.png">
    <style>
        :root {
            --primary: #ff6600; --bg-dark: #0f0f0f; --card-bg: #1e1e1e;
            --text-light: #ffffff; --text-gray: #aaaaaa; --border: #333333;
            --success: #00c851; --danger: #ff4444; --info: #33b5e5;
            --updated-color: #aa00ff;
            --print-color: #0066cc;
            --alert-color: #ff3300;
            --cancelled-color: #ff4444;
            --customer-color: #33b5e5;
            --delivery-color: #00bcd4;
        }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
        
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .start-btn { padding: 20px 60px; font-size: 1.5rem; background: transparent; color: var(--primary); border: 2px solid var(--primary); border-radius: 50px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s; }
        .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 30px rgba(255,102,0,0.5); }

        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
        .brand { font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; gap: 15px; }
        .brand img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
        .system-info { text-align: left; }
        .clock { font-size: 1.4rem; font-weight: bold; font-family: monospace; }
        .status { color: var(--success); font-size: 0.8rem; font-weight: bold; }

        .tabs-container { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .tab-btn { background: #222; color: #888; border: 1px solid #333; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 1.1rem; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .tab-badge { background: #000; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        .ticket { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; animation: fadeIn 0.5s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; }
        .ticket.completed-ticket { opacity: 0.8; border-color: #444; filter: grayscale(0.2); }
        .ticket.completed-ticket .t-header { background: #1a1a1a; border-top-color: #444; }
        .ticket.completed-ticket .t-id { color: #888; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .t-header { background: #252525; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); border-top: 4px solid var(--primary); }
        .t-id { font-size: 1.6rem; font-weight: 900; color: var(--primary); }
        .t-time { font-family: monospace; color: var(--text-gray); font-size: 1rem; }

        .t-tags { padding: 10px 15px; background: #2a2a2a; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--border); }
        .tag { flex: 1; text-align: center; padding: 4px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; }
        
        .tag-now { background: rgba(255, 102, 0, 0.15); color: #ff6600; border: 1px solid #ff6600; }
        .tag-later { background: rgba(51, 181, 229, 0.15); color: #33b5e5; border: 1px solid rgba(51,181,229,0.3); }
        .tag-new { background: rgba(0, 200, 81, 0.15); color: #00c851; border: 1px solid rgba(0,200,81,0.3); }
        .tag-old { background: rgba(255, 68, 68, 0.15); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
        
        /* Delivery Fee Section Styles */
        .t-delivery-container {
            padding: 10px 15px;
            background: rgba(0, 188, 212, 0.1);
            border-top: 1px solid rgba(0, 188, 212, 0.3);
            border-bottom: 1px solid rgba(0, 188, 212, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--delivery-color);
        }
        
        .delivery-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        
        .delivery-value {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            background: rgba(0, 188, 212, 0.2);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid var(--delivery-color);
        }

        .updated-badge { background: var(--updated-color); color: white; font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-right: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .t-body { padding: 15px; flex-grow: 1; }
        .items-ul { list-style: none; padding: 0; margin: 0; }
        .item-li { padding: 8px 0; border-bottom: 1px solid #333; font-size: 1.1rem; font-weight: 700; line-height: 1.4; display: flex; align-items: flex-start; }
        .item-li::before { content: "•"; color: var(--primary); margin-left: 8px; font-size: 1.2rem; }
        .item-li:last-child { border-bottom: none; }

        .t-notes-container {
            background: #332b00;
            border: 1px solid #665500;
            border-radius: 8px;
            margin: 10px 15px;
            overflow: hidden;
        }
        
        .notes-header {
            background: #443300;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffdd44;
            font-weight: bold;
            border-bottom: 1px solid #665500;
        }
        
        .notes-list {
            list-style: none;
            padding: 10px;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .note-item {
            padding: 8px 0;
            color: #ffdd44;
            font-size: 0.9rem;
            line-height: 1.4;
            display: flex;
            align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 221, 68, 0.2);
        }
        
        .note-item:last-child {
            border-bottom: none;
        }
        
        .note-item::before {
            content: "•";
            color: #ffaa00;
            font-size: 1.2rem;
            margin-left: 8px;
            flex-shrink: 0;
        }
        
        .note-text {
            flex: 1;
        }

        .t-total { background: #2d2d2d; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .total-txt { color: #aaa; font-size: 0.9rem; }
        .total-num { color: var(--primary); font-size: 1.3rem; font-weight: 900; }

        .t-footer { padding: 15px; background: #161616; font-size: 0.9rem; color: #ccc; }
        .info-line { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
        .info-line i { width: 20px; text-align: center; color: var(--primary); }
        .info-line a { color: #33b5e5; text-decoration: none; font-weight: bold; }
        .info-addr { margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; color: #888; font-style: italic; font-size: 0.85rem; }
        
        .payment-method { 
            background: rgba(255, 204, 0, 0.1); 
            border: 1px solid #ffcc00; 
            color: #ffcc00; 
            padding: 8px 12px; 
            border-radius: 6px; 
            margin: 8px 0; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            font-size: 1rem;
        }
        
        .customer-info { 
            background: rgba(51, 181, 229, 0.1); 
            border: 1px solid var(--customer-color); 
            color: var(--customer-color); 
            padding: 8px 12px; 
            border-radius: 6px; 
            margin: 8px 0; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            font-size: 1rem;
        }

        .call-btn { background-color: #00c851; color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; text-decoration: none; margin-right: 10px; font-size: 0.9rem; transition: 0.2s; border: 1px solid #00c851; }
        .call-btn:hover { background-color: #007e33; transform: scale(1.1); }

        .t-actions { display: flex; gap: 10px; padding: 10px 15px; background: #222; border-top: 1px solid #333; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; color: #fff;}
        .btn-done { background: #00c851; } .btn-done:hover { background: #007e33; }
        .btn-restore { background: #33b5e5; } .btn-restore:hover { background: #0099cc; }
        .btn-print { background: var(--print-color); } .btn-print:hover { background: #004080; }

        .flash-card { animation: flashBorder 2s infinite; }
        .updated-card { border-color: var(--updated-color); box-shadow: 0 0 15px rgba(170, 0, 255, 0.3); }

        @keyframes flashBorder { 0% {border-color: var(--border);} 50% {border-color: #fff;} 100% {border-color: var(--border);} }
        #loader { width: 100%; text-align: center; margin-top: 50px; color: #666; }

        #alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .alert-container {
            background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
            border-radius: 15px;
            padding: 25px;
            width: 85%;
            max-width: 450px;
            border: 3px solid var(--alert-color);
            box-shadow: 0 0 30px rgba(255, 51, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .alert-header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--alert-color);
            padding-bottom: 10px;
        }

        .alert-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--alert-color);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .alert-subtitle {
            color: #ff9966;
            font-size: 1rem;
            margin-top: 8px;
        }

        .alert-order-id {
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 15px var(--alert-color);
            text-align: center;
            margin: 15px 0;
            animation: pulseGlow 1s infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 15px var(--alert-color); }
            to { text-shadow: 0 0 25px var(--alert-color); }
        }

        .alert-details {
            background: rgba(255, 51, 0, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255, 51, 0, 0.3);
        }

        .alert-detail-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            font-size: 0.95rem;
        }

        .alert-detail-label {
            color: #ff9966;
            font-weight: bold;
        }

        .alert-detail-value {
            color: white;
            font-weight: bold;
        }

        .alert-timer-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .alert-timer-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--alert-color) 100%);
            border-radius: 8px;
            transition: width 0.1s linear;
            position: absolute;
            top: 0;
            left: 0;
        }

        .alert-timer-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            line-height: 12px;
            z-index: 2;
        }

        .alert-actions {
            display: flex;
            margin-top: 20px;
        }

        .alert-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo';
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .alert-btn-received {
            background: linear-gradient(135deg, #00c851 0%, #007e33 100%);
            color: white;
        }

        .alert-btn-received:hover {
            background: linear-gradient(135deg, #00e676 0%, #00b248 100%);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 200, 81, 0.5);
        }

        .alert-btn-cancelled {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
        }

        .alert-btn-cancelled:hover {
            background: linear-gradient(135deg, #ff6666 0%, #ff0000 100%);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }

        .alert-type-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .alert-type-new {
            background: rgba(0, 200, 81, 0.2);
            color: #00c851;
            border: 1px solid #00c851;
        }

        .alert-type-updated {
            background: rgba(170, 0, 255, 0.2);
            color: #aa00ff;
            border: 1px solid #aa00ff;
        }

        .alert-type-cancelled {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        #print-modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            z-index: 11000; 
            padding: 20px;
            overflow-y: auto;
        }
        
        .print-container {
            background: white;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .print-content { 
            color: black; 
            font-family: 'Cairo', sans-serif;
            direction: rtl;
        }
        
        .print-header { 
            text-align: center; 
            border-bottom: 3px solid #ff6600; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        
        .print-header h1 { 
            margin: 0; 
            color: #ff6600; 
            font-size: 32px; 
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
        }
        
        .print-id { 
            font-size: 38px; 
            font-weight: 900; 
            color: #000; 
            margin: 10px 0;
            font-family: 'Cairo', sans-serif;
        }
        
        .print-time { 
            font-size: 18px; 
            color: #666; 
            margin: 5px 0;
            font-family: 'Cairo', sans-serif;
        }
        
        .print-customer-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px dashed #ccc;
        }
        
        .print-customer-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        
        .print-customer-row:last-child {
            border-bottom: none;
        }
        
        .print-customer-label {
            color: #666;
            font-weight: bold;
        }
        
        .print-customer-value {
            color: #000;
            font-weight: bold;
            text-align: left;
        }
        
        .print-section { 
            margin: 20px 0; 
            padding: 10px 0;
        }
        
        .print-label { 
            font-weight: bold; 
            color: #333; 
            margin-bottom: 8px; 
            font-size: 18px;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 5px;
            font-family: 'Cairo', sans-serif;
        }
        
        .print-items-grid {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 8px;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
        }
        
        .print-grid-header {
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        
        .print-grid-row {
            display: contents;
        }
        
        .print-grid-item {
            padding: 8px 0;
            border-bottom: 1px dashed #ddd;
        }
        
        .print-grid-item-name {
            text-align: right;
            font-weight: bold;
        }
        
        .print-grid-item-qty {
            text-align: center;
            background: #ff6600;
            color: black;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            min-width: 30px;
        }
        
        .print-grid-item-price {
            text-align: center;
            font-weight: bold;
        }
        
        .print-grid-item-total {
            text-align: left;
            font-weight: bold;
            color: #000;
        }
        
        /* Print Summary Section Styles */
        .print-summary-section {
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        
        .print-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        
        .print-summary-row:last-child {
            border-bottom: none;
            border-top: 2px solid #333;
            padding-top: 15px;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .print-summary-label {
            color: #666;
            font-weight: bold;
        }
        
        .print-summary-value {
            color: #000;
            font-weight: bold;
        }
        
        .print-summary-subtotal {
            color: #333;
        }
        
        .print-summary-delivery {
            color: #0066cc;
        }
        
        .print-summary-total {
            color: #ff6600;
            font-size: 22px;
        }
        
        /* العنوان في الفاتورة */
        .print-address-section {
            margin: 20px 0;
            padding: 15px;
            background: #f0f8ff;
            border-radius: 8px;
            border: 2px solid #0066cc;
            text-align: center;
        }
        
        .print-address-label {
            color: #0066cc;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            font-family: 'Cairo', sans-serif;
        }
        
        .print-address-value {
            color: #000;
            font-weight: bold;
            font-size: 20px;
            font-family: 'Cairo', sans-serif;
            line-height: 1.4;
        }
        
        .print-total { 
            font-size: 28px; 
            font-weight: 900; 
            color: #000; 
            text-align: center; 
            margin-top: 25px; 
            padding-top: 15px; 
            border-top: 3px double #333; 
            font-family: 'Cairo', sans-serif;
        }
        
        .print-actions { 
            text-align: center; 
            margin-top: 30px; 
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        .close-print { 
            background: #ff4444; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-family: 'Cairo'; 
            font-weight: bold;
            font-size: 16px;
            margin-left: 10px;
        }
        
        .print-btn { 
            background: #0066cc; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-family: 'Cairo'; 
            font-weight: bold; 
            margin-right: 10px;
            font-size: 16px;
        }

        .deleted-ticket {
            animation: fadeOutDelete 0.5s forwards;
            position: relative;
        }

        .deleted-ticket::after {
            content: "تم حذف هذا الطلب";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 68, 68, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 10;
            font-size: 1.2rem;
            text-align: center;
            width: 80%;
        }

        @keyframes fadeOutDelete {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(0.95); filter: grayscale(1); }
        }

        .print-pickup-time {
            background: #fff8e1;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border: 2px solid #ffc107;
            text-align: center;
            font-weight: bold;
        }
        
        .print-pickup-time.urgent {
            background: #ffeaea;
            border-color: #ff4444;
            color: #d32f2f;
        }
        
        .print-pickup-time.scheduled {
            background: #e8f5e9;
            border-color: #4caf50;

        function findItemPrice(itemName) {
            for(const cat in menuData) {

            }
            return 0;

        function calculateOrderSubtotal(order) {
            let subtotal = 0;
            if (order.items) {
                const items = order.items.split(' + ');
                items.forEach(item => {
                    const match = item.match(/(.+)\s+\(x(\d+)\)\s+-\s+([\d.]+)\s+KD/);
                    if (match) {
                        const totalPrice = parseFloat(match[3]);
                        subtotal += totalPrice;
                    }
                });
            }
            return subtotal;
        }
        
        function getDeliveryFee(order) {
            if (order.deliveryPrice) {
                return order.deliveryPrice;
            }
            
            const total = parseFloat(order.total) || 0;
            const subtotal = calculateOrderSubtotal(order);
            const deliveryFee = total - subtotal;
            
            return deliveryFee > 0 ? deliveryFee.toFixed(3) : "0.000";
        }
        
        function getOrderSubtotal(order) {
            return calculateOrderSubtotal(order).toFixed(3);
        }

            updatedSound.volume = 0.1;
            cancelledSound.volume = 0.1;
            
            const sounds = [newSound, updatedSound, cancelledSound];
            sounds.forEach(sound => {
                sound.play().then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                    sound.volume = 0.7;
                }).catch(console.error);
            });

            fetchData();
            setInterval(fetchData, 7000);
            setInterval(() => {

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if(tab === 'active') {
                document.querySelector('div[onclick="switchTab(\'active\')"]').classList.add('active');
                document.getElementById('active-orders').classList.add('active');
            } else {
                document.querySelector('div[onclick="switchTab(\'completed\')"]').classList.add('active');
                document.getElementById('completed-orders').classList.add('active');
            }
        }

        async function fetchData() {
            if(!systemStarted) return;
            try {
                const res = await fetch(`${API_URL}?t=${Date.now()}`);
                const data = await res.json();
                
                document.getElementById('loader').style.display = 'none';
                processOrders(data);

            } catch (err) {
                console.error("Connection Error");
            }
        }

        function processOrders(orders) {
            const activeGrid = document.getElementById('active-grid');
            const completedGrid = document.getElementById('completed-grid');
            
            const filteredOrders = orders.filter(order => {
                if (deletedOrderIds.has(order.id)) {
                    const ticketElement = document.getElementById(`ticket-${order.id}`);
                    if (ticketElement) {
                        ticketElement.remove();
                    }
                    return false;
                }
                return true;
            });
            
            const activeOrders = filteredOrders.filter(o => o.status !== 'Completed');
            const completedOrders = filteredOrders.filter(o => o.status === 'Completed');

            document.getElementById('count-active').innerText = activeOrders.length;
            document.getElementById('count-completed').innerText = completedOrders.length;

            const currentOrderIds = new Set(orders.map(o => o.id));
            
            for (const orderId of notifiedOrderIds) {
                if (!currentOrderIds.has(orderId) && !deletedOrderIds.has(orderId)) {
                    const deletedOrder = {
                        id: orderId,
                        type: 'Unknown',
                        items: 'تم حذف الطلب',
                        total: '0.000',
                        time: new Date().toISOString(),
                        pickupTime: 'فوري',
                        phone: '',
                        location: '',
                        details: '',
                        notes: 'تم حذف هذا الطلب من قبل الإدارة',
                        paymentMethod: '',
                        status: 'Deleted'
                    };
                    
                    showDeleteAlert(deletedOrder);
                    deletedOrderIds.add(orderId);
                    notifiedOrderIds.delete(orderId);
                }
            }

            activeOrders.forEach(order => {
                if (!notifiedOrderIds.has(order.id)) {
                    showAlert(order, 'new');
                    notifiedOrderIds.add(order.id);
                }
            });

            activeOrders.forEach(order => {
                if (order.status === 'Updated') {
                    if (!notifiedOrderIds.has(`updated-${order.id}`)) {
                        showAlert(order, 'updated');
                        notifiedOrderIds.add(`updated-${order.id}`);
                    }
                }
            });

            isFirstRun = false;

            renderGrid(activeOrders, activeGrid, false);
            renderGrid(completedOrders, completedGrid, true);
        }

        async function logNotification(orderId, status) {
            try {
                const params = new URLSearchParams();
                params.append('action', 'logNotification');
                params.append('orderId', orderId);
                params.append('status', status);
                params.append('timestamp', Date.now());
                params.append('kitchenReceived', 'true');
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                
                const result = await response.json();
                
                console.log(`تم تسجيل إشعار للطلب #${orderId} - الحالة: ${status}`, result);
                return result;
            } catch (error) {
                console.error('خطأ في تسجيل الإشعار:', error);
                throw error;
            }
        }

        function showAlert(order, type) {
            currentAlertOrder = order;
            alertStartTime = Date.now();
            
            const orderDate = new Date(order.time);
            const timeString = orderDate.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false

        function startAlertTimer() {
            if (alertTimerInterval) {
                clearInterval(alertTimerInterval);
            }
            
            document.getElementById('alert-timer-fill').style.width = '0%';
            document.getElementById('alert-timer-text').textContent = 'الدقيقة 0 من 2';
            
            alertTimerInterval = setInterval(() => {
                const elapsed = (Date.now() - alertStartTime) / 1000;
                const percentage = Math.min((elapsed / ALERT_DURATION) * 100, 100);
                
                document.getElementById('alert-timer-fill').style.width = `${percentage}%`;
                
                const minutes = Math.floor(elapsed / 60);
                document.getElementById('alert-timer-text').textContent = `الدقيقة ${minutes} من 2`;
                
                if (elapsed >= ALERT_DURATION) {
                    alertStartTime = Date.now();
                    document.getElementById('alert-timer-fill').style.width = '0%';
                }
            }, 100);
        }

        function startAlertSound(type) {
            if (soundInterval) {
                clearInterval(soundInterval);
            }
            
            let audio;
            switch(type) {
                case 'new':
                    audio = document.getElementById('alert-sound-new');
                    break;
                case 'updated':
                    audio = document.getElementById('alert-sound-updated');
                    break;
                case 'cancelled':
                    audio = document.getElementById('alert-sound-cancelled');
                    break;
                default:
                    audio = document.getElementById('alert-sound-new');
            }
            
            audio.volume = 0.7;
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Sound blocked initially"));
            
            soundInterval = setInterval(() => {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Sound blocked"));
            }, 3000);
        }

        function stopAlertSound() {
            if (soundInterval) {
                clearInterval(soundInterval);
                soundInterval = null;
            }
            
            const sounds = [
                document.getElementById('alert-sound-new'),
                document.getElementById('alert-sound-updated'),
                document.getElementById('alert-sound-cancelled')
            ];
            
            sounds.forEach(sound => {
                sound.pause();
                sound.currentTime = 0;
            });
        }

        async function handleAlertReceived() {
            if (currentAlertOrder) {
                const typeBadge = document.getElementById('alert-type-badge');
                
                if (typeBadge.classList.contains('alert-type-cancelled')) {
                    await handleDeleteAcknowledged();
                } else {
                    document.getElementById('alert-overlay').style.display = 'none';
                    
                    if (alertTimerInterval) {
                        clearInterval(alertTimerInterval);
                        alertTimerInterval = null;
                    }
                    stopAlertSound();
                    
                    const notificationStatus = typeBadge.classList.contains('alert-type-updated') ? 'Updated' : 'New';
                    try {
                        await logNotification(currentAlertOrder.id, notificationStatus);
                        console.log(`تم تسجيل إشعار للطلب #${currentAlertOrder.id} بنجاح`);
                    } catch (error) {
                        console.error('فشل في تسجيل الإشعار:', error);
                    }
                    
                    switchTab('active');
                    
                    setTimeout(() => {
                        const ticketElement = document.getElementById(`ticket-${currentAlertOrder.id}`);
                        if (ticketElement) {
                            ticketElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            
                            ticketElement.style.animation = 'flashBorder 1s infinite';
                            setTimeout(() => {
                                ticketElement.style.animation = '';
                            }, 3000);
                            
                            Swal.fire({
                                toast: true,
                                position: 'top-start',
                                icon: 'success',
                                title: `تم استلام الطلب #${currentAlertOrder.id}`,
                                showConfirmButton: false,
                                timer: 2000,
                                background: '#222',
                                color: '#fff'
                            });
                        }
                    }, 500);
                    
                    currentAlertOrder = null;
                }
            }
        }

        async function handleDeleteAcknowledged() {
            if (currentAlertOrder) {
                document.getElementById('alert-overlay').style.display = 'none';
                
                if (alertTimerInterval) {
                    clearInterval(alertTimerInterval);
                    alertTimerInterval = null;
                }
                stopAlertSound();
                
                try {
                    await logNotification(currentAlertOrder.id, 'Cancelled');
                    console.log(`تم تسجيل إشعار الإلغاء للطلب #${currentAlertOrder.id} بنجاح`);
                } catch (error) {
                    console.error('فشل في تسجيل إشعار الإلغاء:', error);
                }
                
                deletedOrderIds.add(currentAlertOrder.id);
                
                const ticketElement = document.getElementById(`ticket-${currentAlertOrder.id}`);
                if (ticketElement) {
                    ticketElement.classList.add('deleted-ticket');
                    
                    setTimeout(() => {
                        ticketElement.remove();
                        
                        const activeGrid = document.getElementById('active-grid');
                        const activeOrders = Array.from(activeGrid.children).filter(el => !el.classList.contains('completed-ticket'));
                        document.getElementById('count-active').innerText = activeOrders.length;
                    }, 3000);
                }
                
                Swal.fire({
                    toast: true,
                    position: 'top-start',
                    icon: 'info',
                    title: `تم تسجيل إلغاء الطلب #${currentAlertOrder.id}`,
                    showConfirmButton: false,
                    timer: 3000,
                    background: '#222',
                    color: '#fff'
                });
                
                currentAlertOrder = null;
            }
        }

        async function markDone(id) {
            document.getElementById(`ticket-${id}`).style.opacity = '0.5';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=done&id=${id}`
                });
                
                const result = await response.json();
                
                if (result.result === 'success') {
                    console.log(`تم إتمام الطلب #${id}`);
                }
                
                fetchData();
                
                if (currentAlertOrder && currentAlertOrder.id == id) {
                    document.getElementById('alert-overlay').style.display = 'none';
                    if (alertTimerInterval) {
                        clearInterval(alertTimerInterval);
                        alertTimerInterval = null;
                    }
                    stopAlertSound();
                    currentAlertOrder = null;
                }
            } catch (error) {
                console.error('Error marking order as done:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ',
                    text: 'فشل في إتمام الطلب',
                    background: '#222',
                    color: '#fff'
                });
            }
        }

        async function restoreOrder(id) {
            document.getElementById(`ticket-${id}`).style.opacity = '0.5';
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `action=restore&id=${id}`
                });
                
                const result = await response.json();
                
                if (result.result === 'success') {
                    console.log(`تم استرجاع الطلب #${id}`);
                }
                
                fetchData();
            } catch (error) {
                console.error('Error restoring order:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ',
                    text: 'فشل في استرجاع الطلب',
                    background: '#222',
                    color: '#fff'
                });
            }
        }

        function printOrder(id) {
            if (document.getElementById('alert-overlay').style.display === 'flex') {
                document.getElementById('alert-overlay').style.display = 'none';
                stopAlertSound();
            }
            
            fetch(API_URL)
                .then(res => res.json())
                .then(orders => {
                    const order = orders.find(o => o.id == id);
                    if (order) {
                        openPrintModal(order);
                    }
                });
        }

                    </div>
                    <div class="print-summary-row print-summary-total">
                        <span class="print-summary-label">الإجمالي النهائي:</span>
                        <span class="print-summary-value">${calculatedTotal} د.ك</span>
                    </div>
                </div>

                <div class="print-section" style="text-align: center; margin-top: 30px; font-size: 14px; color: #666;">
                    شكراً لثقتكم بـ سفرة الدار
                </div>
            `;

            document.getElementById('print-modal').style.display = 'block';
            
            setTimeout(() => {
                const printBtn = document.querySelector('.print-btn');
                if (printBtn) printBtn.focus();
            }, 100);
        }

        function closePrintModal() {
            document.getElementById('print-modal').style.display = 'none';
            if (currentAlertOrder) {
                document.getElementById('alert-overlay').style.display = 'flex';
                startAlertSound(currentAlertOrder.status === 'Updated' ? 'updated' : 'new');
            }
        }
    </script>
</body>
</html>
